---
- name: Deploy site with nginx
  hosts: webservers
  vars:
    root_dir: /var/www/ansible_site
    nginx_port: 8082
    app_name: Hexlet Demo App

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Create site directory
      ansible.builtin.file:
        path: "{{ root_dir }}"
        state: directory
        mode: '0755'

    - name: Configure nginx
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        mode: '0644'
      notify: Reload nginx config

    - name: Deploy index.html
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ root_dir }}/index.html"
        mode: '0644'

    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Show result
      ansible.builtin.debug:
        msg: "Site is available on port {{ nginx_port }}"

  handlers:
    - name: Reload nginx config
      ansible.builtin.service:
        name: nginx
        state: reloaded
